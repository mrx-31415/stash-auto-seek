name: Auto Seek
description: Finds where the action starts in each scene and skips there, with a button on the player or automatically. Runs on the server.
version: 0.3.1 # x-release-please-version
url: https://github.com/mrx-31415/stash-auto-seek

exec:
  - python
  - "{pluginDir}/auto_seek.py"
  - "{pluginDir}"
interface: raw
errLog: info

ui:
  javascript:
    - auto-seek.js
  css:
    - auto-seek.css

tasks:
  - name: Find start points
    description: Analyses every scene that has no start point yet, newest first, at low priority. Safe to stop; it continues where it left off next time.
    defaultArgs:
      op: library

hooks:
  - name: Analyse new scenes
    description: Queues scenes as a scan adds them, for a background worker on the server.
    triggeredBy:
      - Scene.Create.Post
    defaultArgs:
      op: hook

settings:
  startStage:
    displayName: Start at
    description: "What counts as the start: kissing (kissing or later), oral (oral, hands or sex; the default) or sex (sex positions). Experimental: foreplay (foreplay or later, not tease), anything (tease included), or your own acts as \"acts: kissing, cowgirl\". On Stash 0.27 or later this is a dropdown with a searchable list of acts instead. Changing it works the start points out again."
    type: STRING
  accurateModel:
    displayName: Use the accurate model
    description: A larger image model (ViT-B/16 instead of B/32) that finds starts more accurately, most of all where sex positions begin, draws a steadier act timeline (it reads each frame with the frames 10 s either side), and takes about four times as long to score each frame (0.6 s instead of 0.15 s on two desktop CPU threads). Changing it downloads that model in place of the other and works the start points out again.
    type: BOOLEAN
  largeModel:
    displayName: Use the large model (experimental)
    description: The largest image model (SigLIP2 SO400M), which tells acts apart more reliably than the accurate model but takes about six times as long per frame (about 0.4 s of model time on two CPU threads, against 0.06 s) and is a 0.5 GB download. Overrides the accurate model while on. Changing it works the start points out again.
    type: BOOLEAN
  manualAnalysis:
    displayName: Analyse only when I ask
    description: Opening a scene doesn't start any analysis. A start or timeline already worked out still shows, and an Analyse scene button under the player starts the rest. Handy while you go through scenes by hand.
    type: BOOLEAN
  disableTimeline:
    displayName: Don't scan whole scenes
    description: After finding the start, Auto Seek scans the whole scene in the background and shows each act it sees under the player, with where it first shows. Turn this on to find only the start.
    type: BOOLEAN
  timelineSpacing:
    displayName: Timeline detail (seconds)
    description: Seconds between the frames the whole-scene scan looks at. Smaller finds short moments and draws a finer timeline, for more work per scene (a 30-minute scene at 10 s is about 180 frames). Default 10.
    type: NUMBER
  autoSkip:
    displayName: Skip automatically
    description: When a scene starts playing from the beginning, jump to where the action starts. Off by default; the player button works either way.
    type: BOOLEAN
  leadIn:
    displayName: Lead-in (seconds)
    description: Jump this many seconds before the detected start, for a smoother way in. Default 3.
    type: NUMBER
  hideSkipButton:
    displayName: Hide the Skip intro button
    description: Hides the Skip intro button on the picture and in the control bar. The scan chart still jumps to any frame you tap, and Skip automatically still works.
    type: BOOLEAN
  hideScanChart:
    displayName: Hide the scan chart
    description: Above the seek bar, Auto Seek shows the frames it scored (amber once the action has started) and the start it picked; tap a frame to play from there. Turn this on to hide it.
    type: BOOLEAN
  disableNewScenes:
    displayName: Don't analyse new scenes
    description: New scenes are analysed in the background as a scan adds them. Turn this on to analyse only when a scene is opened, or when you run the Find start points task.
    type: BOOLEAN
  threads:
    displayName: CPU threads per analysis
    description: How many CPU threads the image model may use while analysing a scene. Default 2.
    type: NUMBER
  disableDownload:
    displayName: Don't download the model
    description: Auto Seek fetches its 90 MB image model and an ONNX Runtime build for this server (10–80 MB) in the background soon after installation. Turn this on to prevent that; Auto Seek then stays unavailable.
    type: BOOLEAN
